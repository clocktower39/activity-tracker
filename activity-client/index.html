<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <!-- Relative, so these follow VITE_BASE_PATH instead of assuming a location. -->
    <link rel="icon" href="./favicon.png" />
    <link rel="apple-touch-icon" href="./favicon.png" />
    <meta name="description" content="Record what you actually did, one tap at a time." />
    <!-- Matches the theme ground in both modes so the browser chrome never flashes white. -->
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0D1117" />
    <meta name="theme-color" media="(prefers-color-scheme: light)" content="#E8E6E1" />
    <title>Activity Tracker</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
